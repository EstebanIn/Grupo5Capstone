services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie@sha256:7a7e9f22015b67edb4bef5c59daeebcd7e74bfa570df6ce60ae01237c8648a84
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edugestor}
      POSTGRES_USER: ${POSTGRES_USER:-edugestor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edugestor}
    volumes:
      - edugestor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: >-
      sh -c "python manage.py migrate &&
             exec python manage.py runserver 0.0.0.0:8000"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - edugestor_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A config worker --loglevel=WARNING --concurrency=2

  beat:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A config beat --loglevel=WARNING --schedule=/tmp/celerybeat-schedule

volumes:
  edugestor_pgdata:
  edugestor_redis:
