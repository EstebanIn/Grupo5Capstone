services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edugestor}
      POSTGRES_USER: ${POSTGRES_USER:-edugestor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edugestor}
    volumes:
      - edugestor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: >-
      sh -c "python manage.py migrate &&
             exec python manage.py runserver 0.0.0.0:8000"

volumes:
  edugestor_pgdata:
