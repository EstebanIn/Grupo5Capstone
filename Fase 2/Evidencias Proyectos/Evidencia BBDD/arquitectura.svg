<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura del proyecto Edugestor</title>
  <desc id="desc">Arquitectura de despliegue y flujo de datos: navegador, Django en Docker, PostgreSQL con pgvector, proveedor Gemini y flujo de indexación documental RAG.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17395f"/>
      <stop offset="1" stop-color="#28618c"/>
    </linearGradient>
    <style>
      .bg { fill: #f2f6fb; }
      .title { font: 700 32px "Segoe UI", Arial, sans-serif; fill: #fff; }
      .subtitle { font: 15px "Segoe UI", Arial, sans-serif; fill: #d8e8f6; }
      .zone { fill: #fff; stroke: #aabbd0; stroke-width: 2; }
      .zone-dash { fill: #f7f9fc; stroke: #7c91aa; stroke-width: 2; stroke-dasharray: 10 8; }
      .zone-title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #254b72; letter-spacing: .7px; }
      .card { fill: #fff; stroke: #b9c9da; stroke-width: 1.5; }
      .card-blue { fill: #eaf3fb; stroke: #8eafcf; stroke-width: 1.5; }
      .card-green { fill: #e9f6ef; stroke: #83b99a; stroke-width: 1.5; }
      .card-gold { fill: #fff5df; stroke: #d9b66e; stroke-width: 1.5; }
      .card-violet { fill: #f2edfb; stroke: #ad9acb; stroke-width: 1.5; }
      .card-title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #183b60; }
      .card-title-white { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #fff; }
      .body { font: 14px "Segoe UI", Arial, sans-serif; fill: #334b63; }
      .small { font: 12px "Segoe UI", Arial, sans-serif; fill: #52677d; }
      .tiny { font: 11px "Segoe UI", Arial, sans-serif; fill: #53687d; }
      .mono { font: 12px Consolas, "Courier New", monospace; fill: #31475d; }
      .arrow { fill: none; stroke: #376d9c; stroke-width: 2.5; marker-end: url(#arrow); }
      .arrow-dash { fill: none; stroke: #7d6aa5; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#arrow-violet); }
      .arrow-green { fill: none; stroke: #39835c; stroke-width: 2.5; marker-end: url(#arrow-green); }
      .arrow-gold { fill: none; stroke: #ae7a22; stroke-width: 2.5; marker-end: url(#arrow-gold); }
      .line-label { font: 700 12px "Segoe UI", Arial, sans-serif; fill: #345a7e; }
      .legend { font: 12px "Segoe UI", Arial, sans-serif; fill: #40566d; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#376d9c"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7d6aa5"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#39835c"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ae7a22"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1180"/>
  <rect x="0" y="0" width="1600" height="102" fill="url(#header)"/>
  <text class="title" x="34" y="46">Edugestor · Arquitectura del proyecto</text>
  <text class="subtitle" x="36" y="75">Aplicación web Django multitenant · PostgreSQL + pgvector · Asistentes IA y recuperación curricular RAG</text>

  <!-- Connectors behind the components -->
  <path class="arrow" d="M250 365H302"/>
  <text class="line-label" x="253" y="349">HTTP</text>
  <path class="arrow" d="M1230 340H1280"/>
  <text class="line-label" x="1237" y="322">API Gemini</text>
  <path class="arrow" d="M1200 458H1248V440H1280"/>
  <text class="line-label" x="1211" y="427">embeddings</text>
  <path class="arrow-green" d="M1200 760H1250V700H1280"/>
  <text class="line-label" x="1191" y="747">ORM / SQL</text>
  <path class="arrow-gold" d="M252 817H275V925H300"/>
  <text class="line-label" x="257" y="800">PDF local</text>
  <path class="arrow-dash" d="M300 975H270V925H252"/>
  <text class="line-label" x="256" y="961">JSON</text>
  <path class="arrow-green" d="M1015 1000H1025V770H1240V700H1280"/>
  <text class="line-label" x="1044" y="758">fragmentos + vectores</text>

  <!-- Browser / user -->
  <g>
    <rect class="card-blue" x="26" y="285" width="224" height="177" rx="12"/>
    <rect x="26" y="285" width="224" height="39" rx="12" fill="#28618c"/>
    <path d="M26 312h224v12H26z" fill="#28618c"/>
    <text class="card-title-white" x="45" y="311">Usuario / navegador</text>
    <text class="body" x="45" y="352">Interfaz web</text>
    <text class="body" x="45" y="376">HTML · CSS · JavaScript</text>
    <text class="body" x="45" y="400">Sesión y formularios</text>
    <text class="small" x="45" y="432">Acceso por HTTP :8000</text>
  </g>

  <!-- Docker Compose application boundary -->
  <rect class="zone-dash" x="300" y="132" width="930" height="960" rx="17"/>
  <text class="zone-title" x="324" y="164">DOCKER COMPOSE · SERVICIO WEB (contenedor Python 3.12)</text>
  <text class="small" x="324" y="187">Código del proyecto montado en /app · al iniciar: migrate y luego servidor Django en el puerto 8000</text>

  <!-- Django request / middleware -->
  <g>
    <rect class="card" x="330" y="218" width="870" height="94" rx="10"/>
    <text class="card-title" x="350" y="245">Django · entrada y contexto de la solicitud</text>
    <text class="body" x="350" y="273">config/urls.py → colegio/urls.py</text>
    <text class="body" x="666" y="273">Autenticación / sesiones</text>
    <text class="body" x="900" y="273">InstitucionMiddleware · tenant</text>
    <text class="small" x="350" y="296">Resuelve rutas, valida sesión y determina la institución antes de consultar datos.</text>
  </g>

  <!-- Application layer -->
  <g>
    <rect class="card-blue" x="330" y="338" width="420" height="164" rx="10"/>
    <text class="card-title" x="350" y="367">Lógica de negocio · colegio/</text>
    <text class="body" x="350" y="394">views.py · vistas de gestión escolar</text>
    <text class="body" x="350" y="418">views_ia.py · asistentes y tutor</text>
    <text class="body" x="350" y="442">models.py · modelos y reglas</text>
    <text class="body" x="350" y="466">templates/ · pantallas HTML</text>
    <text class="small" x="350" y="488">Administración · docente · alumno · apoderado</text>
  </g>

  <!-- IA and RAG services -->
  <g>
    <rect class="card-violet" x="775" y="338" width="425" height="164" rx="10"/>
    <text class="card-title" x="795" y="367">Servicios IA · colegio/ia/</text>
    <text class="body" x="795" y="394">proveedor.py · generación de contenido</text>
    <text class="body" x="795" y="418">rag.py · embeddings y búsqueda vectorial</text>
    <text class="body" x="795" y="442">tutor/ · recuperación de contexto</text>
    <text class="body" x="795" y="466">Proveedor real Gemini o modo simulado</text>
    <text class="small" x="795" y="488">Configuración local: GEMINI_API_KEY en .env</text>
  </g>

  <!-- Domain modules -->
  <g>
    <rect class="card" x="330" y="529" width="870" height="119" rx="10"/>
    <text class="card-title" x="350" y="558">Módulos funcionales</text>
    <rect x="350" y="575" width="185" height="45" rx="8" fill="#edf4fa"/>
    <text class="body" x="365" y="603">Usuarios y roles</text>
    <rect x="550" y="575" width="185" height="45" rx="8" fill="#edf4fa"/>
    <text class="body" x="570" y="603">Cursos y matrícula</text>
    <rect x="750" y="575" width="185" height="45" rx="8" fill="#edf4fa"/>
    <text class="body" x="775" y="603">Notas y asistencia</text>
    <rect x="950" y="575" width="225" height="45" rx="8" fill="#f2edfb"/>
    <text class="body" x="966" y="603">Instrumentos IA y tutor</text>
  </g>

  <!-- ORM and management commands -->
  <g>
    <rect class="card-green" x="330" y="675" width="870" height="140" rx="10"/>
    <text class="card-title" x="350" y="704">Persistencia e integración</text>
    <text class="body" x="350" y="733">Django ORM + migraciones colegio/migrations/</text>
    <text class="body" x="350" y="758">Comandos manage.py: indexar_documento_curricular · generar_datos_sinteticos</text>
    <text class="body" x="350" y="783">Archivos estáticos servidos por Django en desarrollo</text>
    <text class="small" x="350" y="805">docker-compose.yml espera a que PostgreSQL esté saludable antes de iniciar el servicio web.</text>
  </g>

  <!-- External services -->
  <g>
    <rect class="card-violet" x="1280" y="256" width="294" height="211" rx="13"/>
    <rect x="1280" y="256" width="294" height="42" rx="13" fill="#68558b"/>
    <path d="M1280 284h294v14h-294z" fill="#68558b"/>
    <text class="card-title-white" x="1302" y="284">Google Gemini API</text>
    <text class="body" x="1302" y="328">Generación de contenido</text>
    <text class="body" x="1302" y="353">Embeddings (768 dimensiones)</text>
    <text class="body" x="1302" y="378">Modelos de respaldo / reintentos</text>
    <text class="small" x="1302" y="412">Servicio externo opcional</text>
    <text class="small" x="1302" y="434">Sin clave: generación simulada*</text>
  </g>

  <!-- Database -->
  <g>
    <rect class="card-green" x="1280" y="515" width="294" height="211" rx="13"/>
    <rect x="1280" y="515" width="294" height="42" rx="13" fill="#347754"/>
    <path d="M1280 543h294v14h-294z" fill="#347754"/>
    <text class="card-title-white" x="1302" y="543">PostgreSQL + pgvector</text>
    <text class="body" x="1302" y="587">Esquema Django (migrate)</text>
    <text class="body" x="1302" y="612">Datos escolares y usuarios</text>
    <text class="body" x="1302" y="637">Documentos + embeddings</text>
    <text class="small" x="1302" y="672">Imagen: pgvector/pgvector · PostgreSQL 17</text>
    <text class="small" x="1302" y="698">Volumen persistente edugestor_pgdata</text>
  </g>

  <!-- Repository and RAG data pipeline -->
  <g>
    <rect class="card-gold" x="26" y="700" width="226" height="234" rx="12"/>
    <rect x="26" y="700" width="226" height="40" rx="12" fill="#a8741f"/>
    <path d="M26 728h226v12H26z" fill="#a8741f"/>
    <text class="card-title-white" x="45" y="727">Repositorio / knowledge</text>
    <text class="body" x="45" y="773">PDF curriculares</text>
    <text class="body" x="45" y="798">JSON estructurado</text>
    <text class="body" x="45" y="823">Código Django y configuración</text>
    <text class="small" x="45" y="861">Los PDF / JSON se versionan</text>
    <text class="small" x="45" y="881">en archivos del proyecto.</text>
    <text class="small" x="45" y="911">Los vectores van a PostgreSQL.</text>
  </g>

  <g>
    <rect class="card-gold" x="300" y="867" width="330" height="117" rx="11"/>
    <text class="card-title" x="320" y="896">Indexación documental (CLI)</text>
    <text class="body" x="320" y="923">pypdf extrae texto → divide en fragmentos</text>
    <text class="body" x="320" y="948">Escribe JSON junto al PDF</text>
    <text class="small" x="320" y="971">manage.py indexar_documento_curricular</text>
  </g>

  <g>
    <rect class="card-gold" x="640" y="925" width="375" height="167" rx="13"/>
    <rect x="640" y="925" width="375" height="42" rx="13" fill="#a8741f"/>
    <path d="M640 953h375v14H640z" fill="#a8741f"/>
    <text class="card-title-white" x="662" y="953">Flujo de indexación RAG</text>
    <text class="body" x="662" y="997">1. Extrae texto y genera fragmentos</text>
    <text class="body" x="662" y="1022">2. Gemini crea embeddings (768 valores)</text>
    <text class="body" x="662" y="1047">3. PostgreSQL guarda texto y vectores</text>
    <text class="small" x="662" y="1075">El JSON de respaldo queda junto al PDF.</text>
  </g>

  <!-- Operational notes and legend -->
  <g>
    <rect class="card" x="1040" y="785" width="534" height="140" rx="11"/>
    <text class="card-title" x="1060" y="814">Despliegue local</text>
    <text class="body" x="1060" y="842">Docker Compose orquesta los contenedores web y db.</text>
    <text class="body" x="1060" y="867">Puerto publicado: localhost:8000 → Django.</text>
    <text class="body" x="1060" y="892">PostgreSQL no publica puerto al host por defecto.</text>
    <text class="small" x="1060" y="914">.env aporta configuración; no debe incluirse en Git.</text>
  </g>

  <g>
    <rect class="card" x="1040" y="950" width="534" height="142" rx="11"/>
    <text class="card-title" x="1060" y="979">Lectura del flujo</text>
    <path class="arrow" d="M1062 1003h54"/>
    <text class="legend" x="1128" y="1008">HTTP / llamadas de aplicación</text>
    <path class="arrow-green" d="M1062 1033h54"/>
    <text class="legend" x="1128" y="1038">Persistencia en base de datos</text>
    <path class="arrow-gold" d="M1062 1063h54"/>
    <text class="legend" x="1128" y="1068">Ingesta documental local</text>
    <path class="arrow-dash" d="M1320 1063h54"/>
    <text class="legend" x="1386" y="1068">JSON intermedio</text>
  </g>

  <text class="tiny" x="30" y="1137">* El proveedor de generación puede funcionar en modo simulado sin GEMINI_API_KEY; la indexación y consulta de embeddings curriculares requieren Gemini y PostgreSQL con pgvector.</text>
  <text class="tiny" x="30" y="1158">Diagrama representativo de la configuración local del repositorio; no describe una infraestructura productiva ni servicios de despliegue no configurados.</text>
</svg>
