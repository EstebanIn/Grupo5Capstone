<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1680" viewBox="0 0 1600 1680" role="img" aria-labelledby="title desc">
<title id="title">EduGestor · Arquitectura actual y alcance de Fase 2</title>
<desc id="desc">Una institución por instalación. Configuración local Django y Docker Compose. RAG curricular integrado en pruebas con pgvector; RAG del tutor presente como código sin conexión a la vista. Revisión estática del ZIP proporcionado, 15 de octubre de 2026.</desc>
<defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17395f"/>
      <stop offset="1" stop-color="#28618c"/>
    </linearGradient>
    <style>
      .bg { fill: #f2f6fb; }
      .title { font: 700 32px "Segoe UI", Arial, sans-serif; fill: #fff; }
      .subtitle { font: 15px "Segoe UI", Arial, sans-serif; fill: #d8e8f6; }
      .zone { fill: #fff; stroke: #aabbd0; stroke-width: 2; }
      .zone-dash { fill: #f7f9fc; stroke: #7c91aa; stroke-width: 2; stroke-dasharray: 10 8; }
      .zone-title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #254b72; letter-spacing: .7px; }
      .card { fill: #fff; stroke: #b9c9da; stroke-width: 1.5; }
      .card-blue { fill: #eaf3fb; stroke: #8eafcf; stroke-width: 1.5; }
      .card-green { fill: #e9f6ef; stroke: #83b99a; stroke-width: 1.5; }
      .card-gold { fill: #fff5df; stroke: #d9b66e; stroke-width: 1.5; }
      .card-violet { fill: #f2edfb; stroke: #ad9acb; stroke-width: 1.5; }
      .card-title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #183b60; }
      .card-title-white { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #fff; }
      .body { font: 14px "Segoe UI", Arial, sans-serif; fill: #334b63; }
