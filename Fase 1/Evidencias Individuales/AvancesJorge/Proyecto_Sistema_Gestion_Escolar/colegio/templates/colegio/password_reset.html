<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | EduGestor</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#f4f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:100%;
            max-width:430px;
            background:white;
            padding:40px;
            border-radius:18px;
            box-shadow:0 10px 30px rgba(0,0,0,.1);
        }

        .logo{
            text-align:center;
            margin-bottom:30px;
        }

        .logo h1{
            color:#1e3a8a;
            font-size:34px;
            margin-bottom:10px;
        }

        .logo p{
            color:#6b7280;
            line-height:1.5;
        }

        form{
            display:flex;
            flex-direction:column;
        }

        label{
            margin-bottom:8px;
            font-weight:bold;
            color:#374151;
        }

        input{
            padding:14px;
            margin-bottom:20px;
            border:1px solid #d1d5db;
            border-radius:8px;
            font-size:15px;
        }

        input:focus{
            outline:none;
            border-color:#2563eb;
        }

        button{
            background:#2563eb;
            color:white;
            border:none;
            padding:14px;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
            font-weight:bold;
            transition:0.3s;
        }

        button:hover{
            background:#1d4ed8;
        }

        .extra-links{
            margin-top:20px;
            text-align:center;
        }

        .extra-links a{
            color:#2563eb;
            text-decoration:none;
            font-size:14px;
        }

        .extra-links a:hover{
            text-decoration:underline;
        }

        .footer{
            text-align:center;
            margin-top:30px;
            color:#9ca3af;
            font-size:13px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="logo">
        <h1>EduGestor</h1>
        <p>
            Ingresa tu correo electrónico y te enviaremos instrucciones
            para recuperar tu contraseña.
        </p>
    </div>

    <form method="POST">
        {% csrf_token %}

        <label>Correo electrónico</label>
        {{ form.email }}

        <button type="submit">
            Enviar enlace de recuperación
        </button>
    </form>

    <div class="extra-links">
        <a href="{% url 'login' %}">Volver al inicio de sesión</a>
    </div>

    <div class="footer">
        © 2026 EduGestor
    </div>

</div>

</body>
</html>
